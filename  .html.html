<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="صفحه معرفی یاسر کاشانی؛ فعال در زمینه صرافی و معاملات ارزی، با اصالت چخانسور ولایت نیمروز افغانستان.">
  <title>یاسر کاشانی | صفحه معرفی</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f4f6f8;color:#18212b;line-height:1.9}
    header{background:linear-gradient(135deg,#102a43,#176b66);color:white;padding:64px 20px;text-align:center}
    header h1{font-size:clamp(2rem,6vw,3.4rem);margin:0 0 8px}
    header p{margin:0;font-size:1.1rem;color:#e3f4f1}
    main{max-width:850px;margin:-25px auto 50px;padding:0 18px}
    .card{background:white;border-radius:18px;padding:30px;box-shadow:0 12px 35px #14253612;margin-bottom:18px}
    h2{color:#176b66;margin-top:0}
    .facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
    .fact{background:#f1f7f6;padding:14px 16px;border-radius:12px}
    .label{display:block;color:#60717d;font-size:.88rem}
    .value{font-weight:700}
    footer{text-align:center;color:#687782;padding:22px;font-size:.9rem}
  </style>
</head>
<body>
  <header>
    <h1>یاسر کاشانی</h1>
    <p>صفحه معرفی شخصی</p>
  </header>
  <main>
    <section class="card">
      <h2>درباره من</h2>
      <p>
        یاسر کاشانی اصالتاً اهل چخانسور، ولایت نیمروز افغانستان است
        و در زمینه صرافی و معاملات ارزی فعالیت می‌کند.
      </p>
    </section>
    <section class="card">
      <h2>اطلاعات</h2>
      <div class="facts">
        <div class="fact"><span class="label">نام</span><span class="value">یاسر کاشانی</span></div>
        <div class="fact"><span class="label">اصالت</span><span class="value">چخانسور، ولایت نیمروز</span></div>
        <div class="fact"><span class="label">کشور</span><span class="value">افغانستان</span></div>
        <div class="fact"><span class="label">حوزه فعالیت</span><span class="value">صرافی و معاملات ارزی</span></div>
      </div>
    </section>
  </main>
  <footer>صفحه معرفی شخصی یاسر کاشانی</footer>
</body>
</html>
